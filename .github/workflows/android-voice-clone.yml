name: Android Voice Clone APK

on:
  push:
    branches: [android-voice-clone]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          ref: android-voice-clone
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: gradle -p android assembleDebug --stacktrace --no-daemon

      - name: Package APK for download
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/VODER-VoiceClone-arm64-debug-v0.1.0.apk
          sha256sum dist/VODER-VoiceClone-arm64-debug-v0.1.0.apk > dist/SHA256SUMS.txt
          cat > dist/README.txt <<'EOF'
VODER Voice Clone - Android TEST build

APK: VODER-VoiceClone-arm64-debug-v0.1.0.apk
ABI: arm64-v8a
Minimum Android: 12 / API 31
Signing: Android debug/test certificate (not a production release key)

The app downloads the Qwen3-TTS GGUF model after installation and stores it
in app-private storage. Inference is intended to run locally on the phone.

Install the APK, open it, download the model, select a WAV reference voice,
enter text, and generate the cloned voice locally.
EOF
          (cd dist && zip -9 ../VODER-VoiceClone-arm64-debug-v0.1.0.zip VODER-VoiceClone-arm64-debug-v0.1.0.apk SHA256SUMS.txt README.txt)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voder-voice-clone-debug-apk
          path: dist/VODER-VoiceClone-arm64-debug-v0.1.0.apk
          if-no-files-found: error

      - name: Upload ZIP bundle
        uses: actions/upload-artifact@v4
        with:
          name: voder-voice-clone-debug-zip
          path: VODER-VoiceClone-arm64-debug-v0.1.0.zip
          if-no-files-found: error
